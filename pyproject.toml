[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-security-guard"
version = "0.1.0"
description = "Local security guard contracts and evaluation foundation for agent tool calls"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic==2.13.4",
]

[tool.setuptools.packages.find]
include = ["guard*"]
