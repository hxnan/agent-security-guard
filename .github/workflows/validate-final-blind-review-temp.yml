name: Validate final Eval V1 blind review temp

on:
  push:
    branches:
      - review/eval-v1-blind-packet-export-temp-20260814

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/eval-v1-independent-agent-20260814
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: python -m pip install -e .
      - name: Validate reviewer answers
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from guard.eval_review import load_review_answers

          path = Path('data/eval-v1/reviews/agent-blind-review-2026-08-14.jsonl')
          rows = [json.loads(line) for line in path.read_text(encoding='utf-8').splitlines() if line.strip()]
          required = {'sample_id','decision','severity','category','summary','confidence','evidence'}
          assert len(rows) == 100, len(rows)
          for row in rows:
              assert set(row) == required, (row.get('sample_id'), set(row))
          ids = [row['sample_id'] for row in rows]
          assert ids == [f'EV{i:03d}' for i in range(1, 101)]
          answers = load_review_answers(path)
          assert len(answers) == 100
          print('review answers OK: EV001-EV100, schema valid')
          PY
      - name: Verify final diff scope
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "26b145199cad79be248f5411b5d833caf6f33904"
          mapfile -t files < <(git diff --name-only 17996d6b75f8860ffe54ffa9e1d8e77f12be0132..HEAD)
          printf '%s\n' "${files[@]}"
          test "${#files[@]}" -eq 2
          test "${files[0]}" = "data/eval-v1/reviews/agent-blind-review-2026-08-14.jsonl"
          test "${files[1]}" = "data/eval-v1/reviews/agent-blind-review-2026-08-14.md"
          if printf '%s\n' "${files[@]}" | grep -q '^data/eval-v1/gold/'; then exit 1; fi
          echo 'final diff OK: exactly two review files; no Gold changes'
