name: Export Eval V1 blind packet temp

on:
  push:
    branches:
      - review/eval-v1-blind-packet-export-temp-20260814

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: python -m pip install -e .
      - name: Export request-only packet
        run: python scripts/export_eval_review_packet.py --output .blind/eval-v1-blind-17996d6.jsonl
      - name: Validate packet isolation
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('.blind/eval-v1-blind-17996d6.jsonl')
          rows = [json.loads(line) for line in path.read_text(encoding='utf-8').splitlines() if line.strip()]
          assert len(rows) == 100, len(rows)
          expected_ids = [f'EV{i:03d}' for i in range(1, 101)]
          actual_ids = [row['sample_id'] for row in rows]
          assert actual_ids == expected_ids
          for row in rows:
              assert set(row.keys()) == {'sample_id', 'request'}, row['sample_id']
          print('blind packet OK: 100 request-only samples')
          PY
      - name: Commit blind packet to temp branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .blind/eval-v1-blind-17996d6.jsonl
          git commit -m 'chore: export request-only Eval V1 blind packet'
          git push
